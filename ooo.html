<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ooo</title>
    <style>
        /* 清除默认边距，让背景铺满 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 设置背景图 */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            /* 替换为你的蝙蝠背景图路径 */
            background-image: url('3688305ivtv18plwx.jpg'); 
            background-size: cover;       /* 确保背景覆盖整个屏幕 */
            background-position: center;  /* 背景居中对齐 */
            background-repeat: no-repeat;
            background-attachment: fixed; /* 滚动时背景固定，体验更佳 */
            padding: 20px;
        }

        /* 中间的大图样式 */
        .centered-image {
            max-width: 80%;       /* 限制最大宽度，避免撑满屏幕 */
            max-height: 80vh;     /* 限制最大高度，防止纵向溢出 */
            object-fit: contain;  /* 保持图片原本的宽高比 */
            
            /* 样式优化：添加暗色阴影与微弱边框，使其融入暗红背景 */
            border: 4px solid rgba(40, 10, 10, 0.6); 
            border-radius: 8px;   /* 边缘轻微圆角 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 
                        0 0 25px rgba(139, 0, 0, 0.3); /* 带有暗红色的氛围灯特效 */
            
            /* 动效：鼠标悬停时轻微放大 */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .centered-image:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 
                        0 0 35px rgba(255, 69, 0, 0.4); /* 悬停时红光增强 */
        }
    </style>
</head>
<body>

    <img src="friends.jpg" alt="Friends" class="centered-image">

</body>
</html>
