<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ending 3 - 真结局</title>
    <style>
        /* 全黑背景，整体纵向居中对齐 */
        body {
            margin: 0;
            padding: 40px;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace, "Microsoft YaHei";
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            letter-spacing: 2px;
            box-sizing: border-box;
        }

        /* 结局文本容器 */
        .ending-text-container {
            max-width: 650px;
            font-size: 22px;
            line-height: 1.8;
            margin-bottom: 50px;
            width: 100%;
        }

        /* 统一的渐现容器基础样式 */
        .fade-in-section {
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease, visibility 2s ease;
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        /* 触发显示后的状态 */
        .fade-in-section.show {
            opacity: 1;
            visibility: visible;
        }

        /* 虚构声明文字样式 */
        .disclaimer-text {
            font-size: 16px;
            color: #777777; /* 暗灰色，低调不抢戏 */
            margin-bottom: 40px;
            font-weight: normal;
        }

        /* 联系方式图片容器 */
        .contact-container {
            display: flex;
            justify-content: center;
            gap: 30px; /* 三张图之间的间距 */
            margin-top: 20px;
        }

        /* 单个联系方式的图片样式 */
        .contact-img {
            width: 45px;       /* 图片宽度，可根据实际尺寸调整 */
            height: 45px;      /* 图片高度 */
            object-fit: contain;
            filter: grayscale(100%) brightness(80%); /* 让图片带有一点点复古灰色，悬疑感更统一 */
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        /* 鼠标悬停时亮起并微动 */
        .contact-img:hover {
            filter: grayscale(0%) brightness(100%);
            transform: scale(1.1);
        }

        /* 打字机闪烁光标 */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 24px;
            background-color: #ffffff;
            margin-left: 2px;
            animation: blink 0.75s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #ffffff; }
        }
    </style>
</head>
<body>

    <div class="ending-text-container">
        <span id="text-target"></span><span id="cursor-element" class="cursor"></span>
    </div>

    <div id="disclaimer-section" class="fade-in-section disclaimer-text">
        —— 本游戏剧情纯属虚构，如有雷同纯属巧合 ——
    </div>

    <div id="contact-section" class="fade-in-section">
        <div class="contact-container">
            <img src="wechat.jpg" alt="联系方式1" class="contact-img" title="联系方式1">
            <img src="zanshang.jpg" alt="联系方式2" class="contact-img" title="联系方式2">
            <img src="xiaohongshu.jpg" alt="联系方式3" class="contact-img" title="联系方式3">
        </div>
    </div>

    <script>
        // 剧情文本内容
        const lines = [
            "随着无上圣佛的落网，我的使命还没有结束……",
            "无上圣佛与平井进次郎之间究竟存在着什么关系？",
            "也许我要去神户现地调查一番了。"
        ];

        const targetElement = document.getElementById("text-target");
        const cursorElement = document.getElementById("cursor-element");
        
        const disclaimerSection = document.getElementById("disclaimer-section");
        const contactSection = document.getElementById("contact-section");
        
        let lineIndex = 0;
        let charIndex = 0;
        const typingSpeed = 120; // 每一个字的打字速度

        function typeWriter() {
            if (lineIndex < lines.length) {
                const currentLine = lines[lineIndex];
                
                if (charIndex < currentLine.length) {
                    targetElement.innerHTML += currentLine.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, typingSpeed);
                } else {
                    targetElement.innerHTML += "<br><br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 800); // 换行停顿
                }
            } else {
                // 文字打印结束，关掉光标
                cursorElement.style.display = "none";
                
                // 【节奏控制】
                // 1. 打印完 1 秒后，渐渐显示“纯属虚构声明”
                setTimeout(() => {
                    disclaimerSection.classList.add("show");
                    
                    // 2. 声明开始显示 1.5 秒后，接着渐渐显示“三个联系方式的图”
                    setTimeout(() => {
                        contactSection.classList.add("show");
                    }, 1500);

                }, 1000);
            }
        }

        // 页面打开 1 秒后启动
        window.onload = () => {
            setTimeout(typeWriter, 1000);
        };
    </script>
</body>
</html>
