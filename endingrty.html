<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDING - THANK YOU</title>
    <style>
        /* 基础重置：纯黑背景，营造寂静、落幕的氛围 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 文字容器 */
        .text-container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        /* 柔和的白色文字，带有淡淡的叙事感投影 */
        .ending-text {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.8;
            opacity: 0; /* 初始透明 */
            transition: opacity 1.5s ease-in-out; /* 1.5秒的丝滑淡入淡出 */
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="text-container">
    <div id="textStage" class="ending-text">
        没关系，你愿意倾听我们的故事，我已经很开心了
    </div>
</div>

<script type="text/javascript">
    window.onload = function() {
        const textStage = document.getElementById('textStage');

        // Step 1: 页面加载完成 0.5 秒后，文字缓缓淡入
        setTimeout(() => {
            textStage.style.opacity = 1;
        }, 500);

        // Step 2: 文字静静维持 3.5 秒后，缓缓淡出隐去
        setTimeout(() => {
            textStage.style.opacity = 0;
        }, 4000);

        // Step 3: 文字完全隐去后（经历1.5秒淡出动画），静默跳转到结局最终页
        setTimeout(() => {
            window.location.href = "ending12345.html";
        }, 5600);
    };
</script>

</body>
</html>
