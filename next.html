<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL - PHASE 2</title>
    <style>
        /* 基础重置：极简纯黑背景，带给玩家压抑和神秘感 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050708;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 文本展示核心区域 */
        .content-box {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        /* 白色的字，带有一点渐变过渡和微弱的呼吸灯投影 */
        .story-text {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        /* 选项按钮包裹器 */
        .choice-container {
            display: none; /* 初始隐藏 */
            margin-top: 30px;
            gap: 20px;
            justify-content: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* 选项按钮样式 */
        .choice-btn {
            background: none;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .choice-btn:hover {
            background-color: #ffffff;
            color: #050708;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="content-box">
    <div id="textDisplay" class="story-text"></div>

    <div id="choiceBox" class="choice-container">
        <button class="choice-btn" onclick="choose(true)">记得</button>
        <button class="choice-btn" onclick="choose(false)">不记得</button>
    </div>
</div>

<script type="text/javascript">
    const textDisplay = document.getElementById('textDisplay');
    const choiceBox = document.getElementById('choiceBox');

    /* ===================================================
       1. Web Audio API：无音频文件生成精密摩斯密码（长音）
       =================================================== */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(startTime, duration) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';          // 正弦波，声音纯净
        oscillator.frequency.value = 700;  // 700Hz 经典的复古警报/摩斯电码频率

        // 音量平滑控制，防止爆音
        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(0.2, startTime + 0.02); 
        gainNode.gain.setValueAtTime(0.2, startTime + duration - 0.02);
        gainNode.gain.linearRampToValueAtTime(0, startTime + duration);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
    }

    // 执行三声哔、哔、哔（长音模式：每声持续0.5秒，空隙0.25秒）
    function startMorseAudio() {
        const now = audioCtx.currentTime;
        playBeep(now, 0.5);          // 第一声
        playBeep(now + 0.75, 0.5);   // 第二声
        playBeep(now + 1.5, 0.5);    // 第三声
    }


    /* ===================================================
       2. 文字舞台演出控制流
       =================================================== */
    // 封装文字渐入显现
    function showText(msg) {
        textDisplay.innerText = msg;
        textDisplay.style.opacity = 1;
    }

    // 封装文字渐出隐藏
    function hideText() {
        textDisplay.style.opacity = 0;
    }

    // 整个演出轴
    function startStoryTimeline() {
        // Step 1: 陌生人，你好 (第 0 秒触发，维持 3 秒)
        setTimeout(() => {
            showText("陌生人，你好");
        }, 200);

        setTimeout(() => {
            hideText();
        }, 3200);

        // Step 2: 我相信你也读完了这些帖子吧 (第 3.7 秒触发，维持 3 秒)
        setTimeout(() => {
            showText("我相信你也读完了这些帖子吧");
        }, 3700);

        setTimeout(() => {
            hideText();
        }, 6700);

        // Step 3: 你还记得女孩们的名字吗 (第 7.4 秒触发，并吐出分支选项)
        setTimeout(() => {
            showText("你还记得女孩们的名字吗");
            // 展现分支按钮
            choiceBox.style.display = 'flex';
        }, 7400);
    }


    /* ===================================================
       3. 核心分歧判定与跳转
       =================================================== */
    function choose(isRemembered) {
        if (isRemembered) {
            // 记得，跳转到核心解谜解密页
            window.location.href = "gogogo.html";
        } else {
            // 不记得，跳转到遗忘/失败结局
            window.location.href = "endingrty.html";
        }
    }

    // ⚡ 核心启动交互机制 ⚡
    // 由于现代浏览器限制“网页必须由用户点击后才能发出声音”，因此开屏做一个优雅的遮罩或全局监听。
    // 只要玩家在屏幕上任意点击一下，就会瞬间引爆摩斯密码并开始剧情。
    window.addEventListener('click', function startSequence() {
        // 解锁音频上下文
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        // 播发摩斯长音
        startMorseAudio();
        // 开始文字走字轴
        startStoryTimeline();
        // 销毁监听器，防止重复点击触发
        window.removeEventListener('click', startSequence);
    });

    // 提示玩家点击屏幕开始（符合独立网页游玩习惯）
    textDisplay.innerText = "[ 点击屏幕 允许音频初始化 ]";
    textDisplay.style.opacity = 0.4;
</script>

</body>
</html>
