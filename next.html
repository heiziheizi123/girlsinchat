<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL - PHASE 2</title>
    <style>
        /* 基础重置：极简纯黑背景，带给玩家压抑和神秘感 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050708;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; /* 清除移动端点击高亮蓝色块 */
        }

        /* 文本展示核心区域 */
        .content-box {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            width: 100%;
        }

        /* 白色的字，带有一点渐变过渡和微弱的呼吸灯投影 */
        .story-text {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
            word-break: break-all;
        }

        /* 选项按钮包裹器 */
        .choice-container {
            display: none; /* 初始隐藏 */
            margin-top: 30px;
            gap: 20px;
            justify-content: center;
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* 选项按钮样式 */
        .choice-btn {
            background: none;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 12px 30px; /* 稍微加大一点方便移动端手指点击 */
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 4px;
            outline: none;
        }

        @media (hover: hover) {
            .choice-btn:hover {
                background-color: #ffffff;
                color: #050708;
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            }
        }

        /* 针对移动端触摸态的反馈 */
        .choice-btn:active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="content-box">
    <div id="textDisplay" class="story-text"></div>

    <div id="choiceBox" class="choice-container">
        <button class="choice-btn" onclick="choose(true)">记得</button>
        <button class="choice-btn" onclick="choose(false)">不记得</button>
    </div>
</div>

<script type="text/javascript">
    const textDisplay = document.getElementById('textDisplay');
    const choiceBox = document.getElementById('choiceBox');

    /* ===================================================
       1. Web Audio API 初始化
       =================================================== */
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playBeep(startTime, duration) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';          
        oscillator.frequency.value = 700;  

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(0.2, startTime + 0.02); 
        gainNode.gain.setValueAtTime(0.2, startTime + duration - 0.02);
        gainNode.gain.linearRampToValueAtTime(0, startTime + duration);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
    }

    function startMorseAudio() {
        const now = audioCtx.currentTime;
        // 移动端在同一线程内至少需要立刻触发一个音，后面的排队音轨才不会被拦截
        playBeep(now, 0.5);          // 第一声
        playBeep(now + 0.75, 0.5);   // 第二声
        playBeep(now + 1.5, 0.5);    // 第三声
    }


    /* ===================================================
       2. 文字舞台演出控制流
       =================================================== */
    function showText(msg) {
        textDisplay.innerText = msg;
        textDisplay.style.opacity = 1;
    }

    function hideText() {
        textDisplay.style.opacity = 0;
    }

    function startStoryTimeline() {
        // Step 1
        setTimeout(() => {
            showText("陌生人，你好");
        }, 200);

        setTimeout(() => {
            hideText();
        }, 3200);

        // Step 2
        setTimeout(() => {
            showText("我相信你也读完了这些帖子吧");
        }, 3700);

        setTimeout(() => {
            hideText();
        }, 6700);

        // Step 3
        setTimeout(() => {
            showText("你还记得女孩们的名字吗");
            choiceBox.style.display = 'flex';
        }, 7400);
    }


    /* ===================================================
       3. 核心分歧判定与跳转
       =================================================== */
    function choose(isRemembered) {
        if (isRemembered) {
            window.location.href = "gogogo.html";
        } else {
            window.location.href = "endingrty.html";
        }
    }

    /* ===================================================
       4. 移动端兼容性核心启动器
       =================================================== */
    function startSequence(e) {
        // 阻止某些移动端浏览器的双击放大默认行为
        if (e.cancelable) e.preventDefault(); 

        // 1. 初始化并强行恢复音频上下文
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        // 2. iOS 特效：在当前用户点击的主线程中塞入一个无声音频，彻底骗过 iOS 安全机制
        if (audioCtx) {
            const dummyBuffer = audioCtx.createBuffer(1, 1, 22050);
            const dummySource = audioCtx.createBufferSource();
            dummySource.buffer = dummyBuffer;
            dummySource.connect(audioCtx.destination);
            dummySource.start(0);
        }

        // 3. 播放摩斯音频与启动剧情
        startMorseAudio();
        startStoryTimeline();

        // 4. 移除所有监听，防止重复触发
        window.removeEventListener('click', startSequence, { passive: false });
        window.removeEventListener('touchstart', startSequence, { passive: false });
    }

    // 同时监听点击和移动端触摸事件
    window.addEventListener('click', startSequence, { passive: false });
    window.addEventListener('touchstart', startSequence, { passive: false });

    // 提示玩家点击
    textDisplay.innerText = "[ 点击屏幕 允许音频初始化 ]";
    textDisplay.style.opacity = 0.4;
</script>

</body>
</html>
